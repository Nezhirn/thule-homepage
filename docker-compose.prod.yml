services:
  homepage:
    image: thuleseeker/thule:1.2.1
    container_name: thule-homepage
    # Bound to loopback by default. Set AUTH_TOKEN before exposing the port.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The directory must be writable by uid 10001 (the container user):
      #   sudo chown -R 10001:10001 homepage-data
      - ./homepage-data:/app/data
    environment:
      - TZ=Europe/Moscow
      # - AUTH_TOKEN=change-me
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
