services:
  homepage:
    image: thuleseeker/thule:latest
    container_name: thule-homepage
    # Bound to loopback by default: the app has no network perimeter of its
    # own. Put it behind a reverse proxy for remote access and set AUTH_TOKEN.
    ports:
      - "8000:8000"
    volumes:
      # Persistent data on the host (database + uploaded images).
      # The directory must be writable by uid 10001 (the container user):
      #   sudo chown -R 10001:10001 homepage-data
      - ./homepage-data:/app/data
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
