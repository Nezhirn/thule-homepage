[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RET", "UP", "S"]
ignore = [
    "B008",   # FastAPI dependencies are function calls in defaults
    "S104",   # binding 0.0.0.0 is intentional for the container
    "UP006",  # List[...] kept for explicit API typing
    "UP007",  # Optional[...] kept for explicit API typing
    "UP035",  # typing.List kept for consistency with existing schemas
    "UP045",  # Optional[...] kept for explicit API typing
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]
